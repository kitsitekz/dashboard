<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный дашборд</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--ac:#2563eb;--hl:#dcfce7;--hlb:#16a34a;--br:#e5e7eb;--bk:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181d27;--tx:#e8eaf0;--mu:#8b93a3;--ac:#6ea0ff;--hl:#12301f;--hlb:#34d399;--br:#2a3140;--bk:#3a3012}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181d27;--tx:#e8eaf0;--mu:#8b93a3;--ac:#6ea0ff;--hl:#12301f;--hlb:#34d399;--br:#2a3140;--bk:#3a3012}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-size:clamp(44px,9vw,84px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.date{color:var(--mu);font-size:18px;margin-top:4px}
.wx{text-align:right;font-size:18px}.wx b{font-size:34px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;border:1px solid var(--br);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:16px}
.c h3{margin:0 0 6px;font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:26px;font-weight:700}.sm{color:var(--mu);margin-top:4px}
.bar{height:8px;background:var(--br);border-radius:6px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hlb)}
table{width:100%;border-collapse:collapse}td{padding:9px 8px;border-bottom:1px solid var(--br)}
tr.now td{background:var(--hl);font-weight:700}tr.now td:first-child{border-left:4px solid var(--hlb)}
tr.done{opacity:.45}
.tbl{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--bk);padding:4px 10px;border-radius:20px;font-size:15px}
h2{margin:6px 0 10px}
</style></head><body><div class="w">
<header><div><div class="clock" id="clk"></div><div class="date" id="dt"></div></div>
<div class="wx" id="wx">Погода…</div></header>
<nav id="nav"></nav><main id="main"></main>
<p class="sm" style="text-align:center">Павлодар · <button id="th" style="padding:4px 10px">Тема: авто</button></p>
</div>
<script>
// ===== ДАННЫЕ (правьте здесь) =====
const P=(a)=>a.map(x=>({n:x[0],s:x[1],e:x[2]}));
const SCH_REG=P([['Зарядка','7:50','7:55'],['1 урок','8:00','8:45'],['2 урок','8:50','9:35'],['3 урок','9:50','10:35'],['4 урок','10:50','11:35'],['5 урок','11:50','12:35'],['6 урок','12:45','13:30'],['7 урок','13:35','14:20'],['8 урок','14:25','15:10'],['9 урок','15:15','16:00'],['Чтение 20 мин','16:00','16:20']]);
const SCH_WED=P([['Зарядка','7:50','7:55'],['Классный час','8:00','8:25'],['1 урок','8:30','9:15'],['2 урок','9:20','10:05'],['3 урок','10:20','11:05'],['4 урок','11:20','12:05'],['5 урок','12:20','13:05'],['6 урок','13:15','14:00'],['7 урок','14:05','14:50'],['8 урок','14:55','15:40'],['9 урок','15:45','16:30']]);
const COL_MON=P([['Классный час','7:45','8:05'],['2 пара','8:10','9:40'],['3 пара','9:45','11:15'],['4 пара','11:45','13:15'],['5 пара','13:20','14:50'],['6 пара','15:10','16:40'],['7 пара','16:45','18:15']]);
const COL_TUE=P([['1 пара','7:45','9:15'],['2 пара','9:20','10:50'],['3 пара','11:20','12:50'],['4 пара','12:55','14:25'],['5 пара','14:45','16:15'],['6 пара','16:20','17:50'],['7 пара','17:55','19:25']]);
const UNI=P([['1 пара','8:15','9:05'],['2 пара','9:15','10:05'],['3 пара','10:15','11:05'],['4 пара','11:15','12:05'],['5 пара','12:35','13:25'],['6 пара','13:35','14:25'],['7 пара','14:35','15:25'],['8 пара','15:30','16:20'],['9 пара','16:25','17:15']]);
// варианты расписаний: days 1=Пн ... 5=Пт. Выбор по дню недели происходит автоматически
const SCHOOL_V=[{name:'Пн, Вт, Чт, Пт',days:[1,2,4,5],list:SCH_REG},{name:'Среда (с классным часом)',days:[3],list:SCH_WED}];
const COLLEGE_V=[{name:'Понедельник (с классным часом)',days:[1],list:COL_MON},{name:'Вторник – пятница',days:[2,3,4,5],list:COL_TUE}];
const pick=(V,d)=>V.find(v=>v.days.includes(d));
const SCHOOL=new Proxy({},{get:(_,d)=>(pick(SCHOOL_V,+d)||{}).list});
const COLLEGE=new Proxy({},{get:(_,d)=>(pick(COLLEGE_V,+d)||{}).list});
const UNIV={1:UNI,2:UNI,3:UNI,4:UNI,5:UNI};
const BUS={6:[20,40],7:[0,20,40],8:[0,20,40],9:[0,20,50],10:[20,50],11:[20,50],12:[20,50],13:[20,40],14:[0,30],15:[0,30],16:[0,30],17:[0,20,40],18:[0,20,40],19:[0,20,40],20:[10,40],21:[10,40]};
// ===================================
const DAYS=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const tm=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const f2=n=>String(n).padStart(2,'0'),hm=m=>f2(Math.floor(m/60))+':'+f2(m%60);
const TABS=[['d','Дашборд'],['s','Школа'],['c','Колледж'],['u','Университет'],['b','Автобус 44']];
let tab='d',now=new Date();
const mins=()=>now.getHours()*60+now.getMinutes();
function status(list){
 if(!list)return{k:'off',t:'Сегодня выходной',s:''};
 const t=mins(),L=list.map(x=>({...x,a:tm(x.s),b:tm(x.e)}));
 const cur=L.find(x=>t>=x.a&&t<x.b);
 if(cur)return{k:'now',cur,t:cur.n,s:'до конца '+(cur.b-t)+' мин (до '+hm(cur.b)+')',p:(t-cur.a)/(cur.b-cur.a)*100};
 const nx=L.find(x=>x.a>t);
 if(nx&&t>=L[0].a)return{k:'brk',t:'Перемена',s:'Далее: '+nx.n+' в '+hm(nx.a)+' (через '+(nx.a-t)+' мин)',nx};
 if(nx)return{k:'bef',t:'Ещё не начались',s:'Первое занятие: '+nx.n+' в '+hm(nx.a)+' (через '+(nx.a-t)+' мин)'};
 return{k:'end',t:'Занятия закончились',s:''};
}
function bus(){
 const t=mins(),r=[];
 for(let h=Math.floor(t/60);h<=23&&r.length<4;h++)(BUS[h]||[]).forEach(m=>{if(h*60+m>=t&&r.length<4)r.push(h*60+m)});
 let tomorrow=false;
 if(!r.length){tomorrow=true;r.push(6*60+20,7*60,7*60+20)}
 return{r,tomorrow};
}
function card(title,st,vn){
 return `<div class="c"><h3>${title}</h3><div class="big">${st.t}</div><div class="sm">${st.s}</div>${vn?`<div class="sm">Расписание: ${vn}</div>`:''}${st.k==='now'?`<div class="bar"><i style="width:${st.p}%"></i></div>`:''}</div>`;
}
function table(list,act=true){
 if(!list)return '<p class="sm">В этот день занятий нет.</p>';
 const t=act?mins():-1;
 return '<div class="tbl"><table>'+list.map(x=>{const a=tm(x.s),b=tm(x.e);const c=act?(t>=a&&t<b?'now':(t>=b?'done':'')):'';return `<tr class="${c}"><td>${x.n}</td><td>${x.s}–${x.e}</td><td>${b-a} мин</td></tr>`}).join('')+'</table></div>';
}
function variants(V,d){
 return V.map(v=>{const act=v.days.includes(d);return `<div class="c" style="margin-bottom:12px;${act?'border-color:var(--hlb)':'opacity:.8'}"><h3>${v.name} ${act?'<span class="chip" style="background:var(--hl)">сегодня</span>':''}</h3>${table(v.list,act)}</div>`}).join('');
}
function busCard(){
 const b=bus(),d=b.r[0]-mins();
 const big=b.tomorrow?`Завтра в ${hm(b.r[0])}`:`Через ${d} мин (в ${hm(b.r[0])})`;
 return `<div class="c"><h3>Автобус 44 · Маргулан Университет</h3><div class="big">${big}</div><div class="chips">${b.r.slice(1).map(x=>`<span class="chip">${hm(x)}</span>`).join('')}</div>${[0,6].includes(now.getDay())?'<div class="sm">По выходным расписание другое, показаны будни.</div>':''}</div>`;
}
function busAll(){
 return '<div class="tbl"><table>'+Object.keys(BUS).map(h=>`<tr class="${+h===now.getHours()?'now':''}"><td>${h}</td><td>${BUS[h].map(m=>hm(h*60+m)).join(' · ')}</td></tr>`).join('')+'</table></div>';
}
function render(){
 now=new Date();const d=now.getDay();
 clk.textContent=f2(now.getHours())+':'+f2(now.getMinutes())+':'+f2(now.getSeconds());
 dt.textContent=DAYS[d][0].toUpperCase()+DAYS[d].slice(1)+', '+now.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
 nav.innerHTML=TABS.map(x=>`<button data-t="${x[0]}" class="${x[0]===tab?'on':''}">${x[1]}</button>`).join('');
 const S=status(SCHOOL[d]),C=status(COLLEGE[d]),U=status(UNIV[d]);
 let h='';
 if(tab==='d')h='<div class="g">'+card('Школа',S,(pick(SCHOOL_V,d)||{}).name)+card('Колледж',C,(pick(COLLEGE_V,d)||{}).name)+card('Университет',U)+busCard()+'</div>';
 if(tab==='s')h='<h2>Школа, 5–11 классы</h2>'+card('Сейчас',S)+'<br>'+variants(SCHOOL_V,d);
 if(tab==='c')h='<h2>Колледж</h2>'+card('Сейчас',C)+'<br>'+variants(COLLEGE_V,d);
 if(tab==='u')h='<h2>Университет</h2>'+card('Сейчас',U)+'<br>'+table(UNIV[d]);
 if(tab==='b')h='<h2>Автобус 44</h2>'+busCard()+'<br>'+busAll();
 main.innerHTML=h;
}
nav.onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render()}};
// тема
const modes=['auto','light','dark'],lbl={auto:'авто',light:'светлая',dark:'тёмная'};
let mode='auto';try{mode=localStorage.getItem('th')||'auto'}catch(e){}
function applyTheme(){const r=document.documentElement;mode==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',mode);th.textContent='Тема: '+lbl[mode]}
th.onclick=()=>{mode=modes[(modes.indexOf(mode)+1)%3];try{localStorage.setItem('th',mode)}catch(e){}applyTheme()};
// погода
const WC=c=>c===0?'Ясно':c<4?'Облачно':c<50?'Туман':c<70?'Дождь':c<80?'Снег':c<90?'Ливень':'Гроза';
async function wx(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=52.29&longitude=76.97&current=temperature_2m,weather_code,wind_speed_10m&wind_speed_unit=ms');const j=(await r.json()).current;document.getElementById('wx').innerHTML=`<b>${Math.round(j.temperature_2m)}°C</b><br>${WC(j.weather_code)}, ветер ${Math.round(j.wind_speed_10m)} м/с`}catch(e){document.getElementById('wx').textContent='Погода недоступна'}}
applyTheme();render();wx();setInterval(render,1000);setInterval(wx,600000);
</script></body></html>
